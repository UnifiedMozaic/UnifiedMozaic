# テスト（node tests/run.ts）を Windows（x64）・macOS（arm64）・Linux（x86_64）で流す。
# 使うライブラリ（wasmtime の C API・wgpu-native・SDL3・FFmpeg の LGPL の共有ライブラリ）は .github/ci/install-deps.sh が揃え、
# actions/cache で次の実行に残す。runner には GPU がないので、wgpu と Metal の試験は飛ばされるか CPU で実行される
# （tests/run.ts の note を参照）。窓と音の試験は SDL の offscreen と dummy の駆動で、画面と音のデバイスなしに実行する。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
          - name: macos-arm64
            os: macos-15
          - name: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      SDL_VIDEO_DRIVER: offscreen
      SDL_AUDIO_DRIVER: dummy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      # --- LLVM / clang ---
      - name: LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          # Ubuntu 24.04 の runner はアドレスの乱数化が強く（mmap_rnd_bits=32）、clang 18 の ThreadSanitizer と
          # AddressSanitizer が起動時に止まる。サニタイザの使える値に下げる。
          sudo sysctl vm.mmap_rnd_bits=28
      - name: LLVM (macOS)
        if: runner.os == 'macOS'
        # Xcode の clang は wasm32 を出せないので、Homebrew の LLVM と lld を入れる（wasm32 には自動でそちらを使う）。
        run: brew install llvm lld

      # --- ライブラリ（Windows はここで LLVM も入れる） ---
      - name: deps path
        run: echo "UM_DEPS=$HOME/um-deps" >> "$GITHUB_ENV"
      # 戻すのと残すのを分ける（actions/cache は、ジョブが成功したときしか残さない。テストが落ちても、
      # 揃えたライブラリは次の実行に残す）。
      - id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/um-deps
          key: um-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/install-deps.sh') }}
      - name: deps
        run: bash .github/ci/install-deps.sh 2>&1 | tee deps.log
      - if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/um-deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: clang version
        run: |
          clang --version
          if [ "$RUNNER_OS" = macOS ]; then /opt/homebrew/opt/llvm/bin/clang --version; fi

      # --- テスト ---
      - name: test
        # 段階の時間切れは失敗として扱われ、下の report failures がログの最後を注釈にする（どこで止まったか分かる）。
        timeout-minutes: 60
        run: |
          # Windows の runner だけで、UM のせいではなく通らない試験の一覧（理由はファイルに書いてある）。
          if [ "$RUNNER_OS" = Windows ]; then export UM_TEST_KNOWN_FAILURES=.github/ci/known-failures-windows.txt; fi
          node tests/run.ts 2>&1 | tee test.log
      - name: known failures
        if: always()
        # 既知の失敗として数えなかった試験を警告の注釈にする（黙って飛ばさない）。
        run: "grep -E '^known ' test.log | sed 's/^known /::warning title=known failure (${{ matrix.name }})::/' || true"
      - name: report failures
        if: failure()
        # 落ちた試験と、ログの最後の行を注釈にする（実行の画面の一覧で、ログを開かずに読めるように）。
        run: bash .github/ci/report-failures.sh ${{ matrix.name }} deps.log test.log
